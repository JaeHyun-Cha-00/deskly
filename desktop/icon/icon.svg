<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3159E0"/>
      <stop offset="1" stop-color="#1E3BAE"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F4"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1A55" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- the tile, sized like a macOS app icon (100 px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- the routing slip -->
  <g filter="url(#lift)">
    <rect x="262" y="214" width="500" height="596" rx="30" fill="url(#sheet)"/>
  </g>
  <!-- ruled lines, one under each step -->
  <g stroke="#C8D0DA" stroke-width="6">
    <path d="M330 382H712M330 497H712M330 612H712M330 727H712"/>
  </g>
  <!-- the double rule -->
  <g fill="#2648C9">
    <rect x="290" y="262" width="12" height="500" rx="6"/>
    <rect x="312" y="262" width="12" height="500" rx="6"/>
  </g>
  <!-- steps: two done, one in progress, one still to come -->
  <circle cx="378" cy="327" r="18" fill="#2648C9"/>
  <rect x="420" y="315" width="236" height="24" rx="12" fill="#1C2738"/>
  <circle cx="378" cy="442" r="18" fill="#2648C9"/>
  <rect x="420" y="430" width="188" height="24" rx="12" fill="#1C2738"/>
  <circle cx="378" cy="557" r="15" fill="none" stroke="#2648C9" stroke-width="6"/>
  <rect x="420" y="545" width="214" height="24" rx="12" fill="#5A6A7E"/>
  <circle cx="378" cy="672" r="15" fill="none" stroke="#B4BFCC" stroke-width="6"/>
  <rect x="420" y="660" width="150" height="24" rx="12" fill="#C8D0DA"/>
</svg>
